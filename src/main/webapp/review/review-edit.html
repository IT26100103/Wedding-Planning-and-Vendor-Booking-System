<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit review | Vows &amp; Vendors</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Playfair+Display&display=swap" rel="stylesheet">
<style>/* Vows & Vendors - shared styles (owner: Home Page / Rishi) */
:root{--ink:#26231f;--olive:#b6c46a;--forest:#3d4a1f;--sand:#f5f3ec;--line:#d9d6cc;--danger:#a63d2f}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans',system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.6}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:400;text-transform:uppercase;letter-spacing:-.02em;line-height:1.05;margin:0 0 .5rem}
h1{font-size:clamp(2rem,5vw,3.6rem)}h2{font-size:1.8rem}h3{font-size:1.2rem}
a{color:var(--forest)}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:.5rem}
.logo{font-family:'Playfair Display',serif;font-size:1.6rem;text-decoration:none;color:var(--ink)}
.nav a{margin-left:1.2rem;text-decoration:none;color:var(--ink);font-size:.92rem}
.nav a:hover{border-bottom:2px solid var(--olive)}
.book-tab{position:fixed;right:0;top:0;height:300px;width:80px;background:var(--olive);color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.1em;text-decoration:none;z-index:9}
main{max-width:1150px;margin:0 auto;padding:2.5rem 1.2rem 4rem}
.lead{text-align:center;max-width:640px;margin:0 auto 2.5rem}
.split{display:grid;grid-template-columns:1.3fr 1fr;gap:1.5rem}
.frame{border:1px solid var(--line);padding:2.5rem;text-align:center}
.frame.left{text-align:left}
.photo{min-height:340px;background:linear-gradient(160deg,#8d9a52,#3d4a1f 70%);display:flex;align-items:flex-end;padding:1rem;color:#fff;font-size:.85rem}
.photo.sand{background:linear-gradient(160deg,#e8dfc8,#b6a77a)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.5rem}
.card{border:1px solid var(--line);padding:1.4rem}
.card .photo{min-height:140px;margin:-1.4rem -1.4rem 1rem}
.form{display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.2rem;text-align:left}
.form .full{grid-column:1/-1}
label{display:block;font-size:.85rem;margin-bottom:.25rem}
input,select,textarea{width:100%;padding:.65rem .75rem;border:1px solid var(--line);font:inherit;background:#fff}
input:focus,select:focus,textarea:focus,a:focus,button:focus{outline:2px solid var(--forest);outline-offset:2px}
.btn{display:inline-block;background:var(--forest);color:#fff;border:0;padding:.75rem 1.6rem;text-decoration:none;cursor:pointer;font:inherit}
.btn:hover{background:#2a3515}.btn.alt{background:var(--olive);color:var(--ink)}.btn.danger{background:var(--danger)}.btn.sm{padding:.3rem .8rem;font-size:.85rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:.7rem .6rem;border-bottom:1px solid var(--line);text-align:left}
th{background:var(--sand);font-weight:600}
.tbl{overflow-x:auto}
.badge{padding:.15rem .6rem;font-size:.78rem;background:var(--sand);border:1px solid var(--line)}
.badge.ok{background:#e4ecc0}.badge.warn{background:#f3e3b8}.badge.bad{background:#f0cfc9}
.bar{height:10px;background:var(--sand);margin:.4rem 0 1rem}.bar span{display:block;height:100%;background:var(--olive)}
.alert{padding:.8rem 1rem;border-left:4px solid var(--olive);background:var(--sand);margin-bottom:1.5rem;text-align:left}
.alert.error{border-color:var(--danger)}
.toolbar{display:flex;gap:.8rem;margin-bottom:1rem;flex-wrap:wrap}.toolbar input,.toolbar select{width:auto;flex:1;min-width:160px}
footer{border-top:1px solid var(--line);padding:1.5rem 2rem;text-align:center;font-size:.85rem}
@media(max-width:800px){.split,.form{grid-template-columns:1fr}.book-tab{height:auto;width:auto;top:auto;bottom:0;writing-mode:horizontal-tb;transform:none;left:0;padding:.8rem}.frame{padding:1.5rem}}

/* v2 additions */
[hidden]{display:none!important}
.photo{background-size:cover;background-position:center}
input[type=radio],input[type=checkbox]{width:auto}
input[readonly]{background:var(--sand)}
.hint{font-size:.82rem;color:#6b665c;margin:.25rem 0 0}
.choice{display:flex;gap:1.4rem;flex-wrap:wrap}
.choice label,.check{display:flex;align-items:center;gap:.5rem;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat{border:1px solid var(--line);padding:1rem}
.stat strong{display:block;font-family:'Playfair Display',Georgia,serif;font-weight:400;font-size:1.8rem;line-height:1.1}
.num{text-align:right;font-variant-numeric:tabular-nums}
.rating{letter-spacing:.12em;color:var(--forest)}
.review{border-bottom:1px solid var(--line);padding:1rem 0}
.review p{margin:.25rem 0}
.actions a{margin-right:.3rem}

/* v3 additions: page video background, hero split, slideshow */
.page-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#fbf9f2}
.page-bg video{width:100%;height:100%;object-fit:cover}
.page-bg::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.66)}
body{background:transparent}
.card,.stat,.tbl{background:rgba(255,255,255,.92)}
.hero-split{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:stretch;margin:2rem 0}
.hero-split>.frame{margin:0;display:flex;flex-direction:column;justify-content:center;padding:2rem 1.5rem}
.hero-split>.frame h1{font-size:clamp(1.8rem,3.2vw,2.8rem)}
.hero-split>.photo{margin:0;min-height:460px;position:relative;overflow:hidden;padding:0}
.slides{position:absolute;inset:0}
.slides span{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;animation:slidefade 18s infinite}
.slides span:nth-child(2){animation-delay:6s}
.slides span:nth-child(3){animation-delay:12s}
@keyframes slidefade{0%{opacity:0}8%{opacity:1}33%{opacity:1}41%{opacity:0}100%{opacity:0}}
.gallery{margin-bottom:1.5rem}
.gallery .photo{min-height:200px}
@media(max-width:700px){.hero-split{grid-template-columns:1fr}.hero-split>.photo{min-height:300px}}
@media (prefers-reduced-motion:reduce){.slides span{animation:none}.slides span:first-child{opacity:1}.page-bg video{display:none}}

.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.75rem 1.2rem;max-width:92vw;z-index:20;font-size:.9rem}

:root{color-scheme:light}
</style></head>
<body>
<div class="page-bg" aria-hidden="true"><video autoplay muted loop playsinline preload="metadata" poster="../assets/img/venue-poster.jpg"><source src="../assets/video/venue.mp4" type="video/mp4"></video></div>
<header class="topbar"><a class="logo" href="../index.html">Vows &amp; Vendors</a>
<nav class="nav">
<a href="../index.html">Home</a>
<a href="../wedding/wedding-details.html">My wedding</a>
<a href="../vendor/vendor-list.html">Vendors</a>
<a href="../venue/venue-search.html">Venues</a>
<a href="../booking/booking-status.html">Bookings</a>
<a href="../guest/guest-list.html">Guests</a>
<a href="../review/review-list.html">Reviews</a>
<a href="../payment/budget.html">Budget</a>
<a href="../user/login.html">Sign in</a>
</nav></header>
<a class="book-tab" href="../booking/booking-form.html">Book your wedding</a>
<main>
<div class="frame left" style="max-width:820px;margin:auto"><h2>Edit your review</h2>
<form class="form" method="post" action="#preview">
<div><label for="id">Review ID</label><input id="id" name="id" value="R001" readonly></div>
<div><label for="targetId">Vendor or venue ID</label><input id="targetId" name="targetId" value="V001" readonly></div>
<div><label for="type">Review type</label><input id="type" name="type" value="VERIFIED" readonly></div>
<div data-when="type=VERIFIED"><label for="bookingId">Booking ID</label><input id="bookingId" name="bookingId" value="B001" readonly></div>
<div><label for="rating">Rating</label><select id="rating" name="rating"><option value="5" selected>5, excellent</option><option value="4">4, good</option><option value="3">3, fair</option><option value="2">2, poor</option><option value="1">1, very poor</option></select></div>
<div class="full"><label for="comment">Your comment</label><textarea id="comment" name="comment" rows="4" maxlength="300" required>Food was excellent; on time</textarea><p class="hint">Required. Commas are saved as semicolons.</p></div>
<div class="full"><button class="btn">Save changes</button> <a href="../review/review-list.html">Cancel</a></div></form></div>

</main>

<script>(function(){
var t=document.createElement('div');t.className='toast';t.hidden=true;document.body.appendChild(t);
var h;function note(m){t.textContent=m;t.hidden=false;clearTimeout(h);h=setTimeout(function(){t.hidden=true},3500);}
window.alert=note;
document.addEventListener('submit',function(e){if(e.defaultPrevented)return;e.preventDefault();note('Preview only. This form connects to the servlet once the backend is built.');});
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href="#preview"]');if(a){e.preventDefault();note('Preview only. This action connects to the servlet once the backend is built.');}});
})();
// UI helpers only. The servlets still validate everything.
(function () {
  var params = new URLSearchParams(window.location.search);

  // 1. Message after a servlet redirect, e.g. booking-status.jsp?msg=created or ?err=clash
  var flash = document.getElementById('flash');
  var good = {created: 'Saved.', updated: 'Changes saved.', deleted: 'Deleted.',
    cancelled: 'Booking cancelled. The date is free again.', rsvp: 'RSVP saved.',
    moderated: 'Review status changed.'};
  var bad = {clash: 'That date is already booked for this vendor or venue. Pick another date.',
    exists: 'That ID is already in use. Choose a different ID.',
    invalid: 'Some details are not valid. Check the form and try again.',
    notfound: 'That record was not found.',
    duplicate: 'You have already reviewed this vendor or venue.'};
  if (flash) {
    if (params.get('err') && bad[params.get('err')]) {
      flash.textContent = bad[params.get('err')]; flash.className = 'alert error'; flash.hidden = false;
    } else if (params.get('msg') && good[params.get('msg')]) {
      flash.textContent = good[params.get('msg')]; flash.hidden = false;
    }
  }

  // 2. Fill a form from the link, e.g. booking-form.jsp?type=VENUE&resourceId=VN001
  document.querySelectorAll('form[data-prefill]').forEach(function (form) {
    params.forEach(function (value, key) {
      form.querySelectorAll('[name="' + key + '"]').forEach(function (el) {
        if (el.type === 'radio') { el.checked = (el.value === value); }
        else if (el.type !== 'checkbox' && !el.value) { el.value = value; }
      });
    });
  });

  // 3. Show the fields that belong to the chosen type: data-when="type=VENUE"
  function current(name) {
    var els = document.querySelectorAll('[name="' + name + '"]');
    for (var i = 0; i < els.length; i++) {
      if (els[i].type === 'radio') { if (els[i].checked) return els[i].value; }
      else return els[i].value;
    }
    return '';
  }
  function seats() {
    var out = document.getElementById('seatPreview');
    if (!out) return;
    var n = 1;
    if (current('type') === 'FAMILY') { n = 1 + (parseInt(current('familyMembers'), 10) || 0); }
    else { var p = document.querySelector('[name="plusOne"]'); n = (p && p.checked) ? 2 : 1; }
    out.textContent = 'Seats needed: ' + n;
  }
  function refresh() {
    document.querySelectorAll('[data-when]').forEach(function (box) {
      var parts = box.getAttribute('data-when').split('=');
      var show = current(parts[0]) === parts[1];
      box.hidden = !show;
      box.querySelectorAll('input,select,textarea').forEach(function (f) { f.disabled = !show; });
    });
    seats();
  }
  document.addEventListener('input', refresh);
  document.addEventListener('change', refresh);
  refresh();

  // 4. Password match
  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (f.hasAttribute('data-match')) {
      var p = f.querySelector('[name=password]'), c = f.querySelector('[name=confirmPassword]');
      if (p && c && p.value !== c.value) { e.preventDefault(); alert('Passwords do not match.'); }
    }
  });

  // 5. Ask before deleting or cancelling: data-confirm="Delete this venue?"
  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('[data-confirm]') : null;
    if (a && !window.confirm(a.getAttribute('data-confirm'))) e.preventDefault();
  });

  // 6. Filter the rows of a table as you type
  var q = document.getElementById('tableFilter');
  if (q) {
    q.addEventListener('input', function () {
      var v = q.value.toLowerCase();
      document.querySelectorAll('tbody tr').forEach(function (r) {
        r.style.display = r.textContent.toLowerCase().indexOf(v) > -1 ? '' : 'none';
      });
    });
  }
})();
</script></body></html>
